experience:
  - role: Chief Engineer, Machine Learning
    org: Samsung R&D
    start: 2024-03-01
    summary: |
      - Leading a research and development initiative on agentic memory and Knowledge Graph-based personalization.
      - Led research project focused on Knowledge Graphs on mobile devices to enhance user personalization experience. Successfully published our research findings in AAAI Main Track-2026.
      - Architected a training-free, on-device physics engine converting 2D images to 3D dynamics (ICASSP 2025), optimizing performance for strict mobile constraints.
      - Engineered an end-to-end vision model (one-stage anchor-free object detection) for aesthetic widget placement, successfully commercialized and currently serving across Samsung Galaxy S25, S26, and other flagship devices.
  - role: Lead Engineer, Machine Learning
    org: Samsung R&D
    start: 2021-03-01
    end: 2024-01-31
    summary: |
      - Developed a highly optimized temporal segmentation deep learning architecture utilizing only 3M trainable parameters (22× fewer than SOTA) while achieving a 13.92% accuracy improvement (published in ICASSP 2023).
      - Owned the end-to-end product lifecycle—from data curation and DNN modeling to on-device inference optimization—for a novel hybrid video-understanding algorithm (WACV 2024, ICASSP 2024).
      - Successfully commercialized the temporal segmentation solution for production, directly integrating it into Samsung Galaxy S24 and S25 flagship devices.
      - Designed a patented Emoji Drawing Detection system and developed an end-to-end native C++ neural inference engine for CNN-based models (CVIP 2022).
  - role: Senior Software Engineer
    org: Samsung R&D
    start: 2019-02-01
    end: 2021-03-31
    summary: |
      - Developed and deployed an on-device multilingual language model for the Indian market, enabling real-time language detection, code-switching, and macaronic language modeling.
      - Engineered a lightweight Language Detection Engine (ICSC 2020) and a comprehensive on-device grammatical error correction system optimized for mobile constraints (ICSC 2021). Commercialized native C++ inference engines and NLP features into the Samsung Neural Keyboard, deployed globally across Galaxy flagship devices.
  - role: Software Engineer
    org: Samsung R&D
    start: 2017-07-01
    end: 2019-03-31
    summary: |
      - Trained and optimized N-gram and LSTM-based neural language models for multiple Indian and global languages, successfully commercialized for global market deployment.
      - Implemented advanced data structures, including MARISA and CEDAR TRIE, to achieve highly efficient on-device user language modeling.
  - role: Research Intern
    org: Samsung R&D
    start: 2017-01-01
    end: 2017-07-31
    summary: |
      - Developed an HMM-based machine learning algorithm for human activity detection, specifically optimized for sensory data on low-resource devices.

