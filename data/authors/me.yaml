bio: |
  Chief Machine Learning Engineer bridging the gap between rigorous theoretical innovation and productization. Specializing in NLP (Language Models, Knowledge Graphs), Computer Vision (Image/Video understanding) and on-device AI productization. Inventor and author with a portfolio of 10+ patents (8 A1-grade) and 10+ publications in top-tier venues (AAAI, WACV, ICASSP). Proficient in C++, Python, and algorithms, with a proven track record of architecting highly optimized, shipping production-ready AI systems. Active reviewer for NeurIPS, EMNLP, and WACV, passionate about driving deep-tech research into tangible product features.

